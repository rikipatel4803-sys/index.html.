<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Birthday Surprise 🎉</title>

<style>
body {
  margin: 0;
  font-family: 'Poppins', sans-serif;
  background: linear-gradient(135deg, #ff9a9e, #fad0c4);
  text-align: center;
  color: white;
  overflow-x: hidden;
}

h1 {
  margin-top: 50px;
}

button {
  padding: 12px 25px;
  border-radius: 25px;
  border: none;
  background: white;
  color: #ff4e50;
  font-size: 16px;
  cursor: pointer;
}

/* Steps */
.step {
  display: none;
  animation: fade 1s ease;
}

@keyframes fade {
  from {opacity: 0;}
  to {opacity: 1;}
}

/* Gallery grid */
.gallery {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: 15px;
  padding: 20px;
}

.gallery img {
  width: 100%;
  border-radius: 15px;
}

.caption {
  font-size: 14px;
}

/* Smooth hearts */
.heart {
  position: fixed;
  bottom: -10px;
  animation: rise 4s linear forwards;
}

@keyframes rise {
  0% {transform: translateY(0); opacity: 1;}
  100% {transform: translateY(-100vh); opacity: 0;}
}
</style>
</head>

<body>

<h1>🎁 Tap for Surprise</h1>

<button onclick="next(1)">Open 💖</button>

<div id="s1" class="step">
  <h2>👀 Ready?</h2>
  <button onclick="next(2)">Next 👉</button>
</div>

<div id="s2" class="step">
  <h2>🎂 Happy Birthday My Bestie 🎂</h2>
  <p>Tu meri life ka best part hai 💕</p>
  <button onclick="next(3)">Memories 📸</button>
</div>

<div id="s3" class="step">
  
  <div class="gallery">

    <div>
      <img src="Gemini_Generated_Image_iqaszfiqaszfiqas.png">
    </div>

    <div>
      <img src="IMG_20260331_115548.jpg">
    </div>

    <div>
      <img src="IMG_20260331_115232.jpg">
    </div>

    <div>
      <img src="Snapchat-133094937.jpg">
      <p class="caption">wahh kya photo ayi h 🥲</p>
    </div>

    <div>
      <img src="Snapchat-436404627.jpg">
      <p class="caption">happy birthday heroine ✨🥳😘</p>
    </div>

  </div>

  <button onclick="next(4)">Final 💖</button>
</div>

<div id="s4" class="step">
  <h2>💖 Stay happy always 🥳</h2>
</div>

<!-- Music -->
<audio id="music" src="https://www.bensound.com/bensound-music/bensound-happyrock.mp3"></audio>

<script>
function next(n) {
  document.getElementById("s" + n).style.display = "block";

  if(n === 1){
    document.getElementById("music").play();
  }

  // smooth heart
  let h = document.createElement("div");
  h.className = "heart";
  h.innerHTML = "💖";
  h.style.left = Math.random() * 100 + "vw";
  h.style.fontSize = (Math.random() * 10 + 15) + "px";
  document.body.appendChild(h);

  setTimeout(() => h.remove(), 4000);
}
</script>

</body>
</html>
