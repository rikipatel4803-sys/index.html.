<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Birthday Surprise 🎉</title>

<style>
body {
  margin: 0;
  font-family: 'Poppins', sans-serif;
  text-align: center;
  background: linear-gradient(135deg, #ff9a9e, #fad0c4);
  overflow-x: hidden;
  color: white;
}

.container {
  margin-top: 60px;
}

button {
  padding: 12px 25px;
  border: none;
  border-radius: 25px;
  background: white;
  color: #ff4e50;
  font-size: 16px;
  cursor: pointer;
}

/* Hidden sections */
.step {
  display: none;
  animation: fadeIn 1s ease forwards;
}

@keyframes fadeIn {
  from {opacity: 0; transform: translateY(20px);}
  to {opacity: 1; transform: translateY(0);}
}

/* Gallery */
img {
  width: 80%;
  max-width: 300px;
  border-radius: 15px;
  margin-top: 15px;
}

.caption {
  font-size: 18px;
}

/* Hearts smooth */
.heart {
  position: fixed;
  bottom: -20px;
  animation: rise 4s linear forwards;
}

@keyframes rise {
  0% { transform: translateY(0) scale(1); opacity: 1;}
  100% { transform: translateY(-100vh) scale(1.5); opacity: 0;}
}
</style>
</head>

<body>

<div class="container">

  <h1>🎉 Tap Tap Surprise 🎁</h1>

  <!-- STEP 1 -->
  <button onclick="nextStep(1)">Start 💖</button>

  <div id="step1" class="step">
    <h2>👀 Ready?</h2>
    <button onclick="nextStep(2)">Next 👉</button>
  </div>

  <!-- STEP 2 -->
  <div id="step2" class="step">
    <h2>💭 Kuch special hai...</h2>
    <button onclick="nextStep(3)">Open 😍</button>
  </div>

  <!-- STEP 3 -->
  <div id="step3" class="step">
    <h2>🎂 Happy Birthday Bestie 🎂</h2>
    <button onclick="nextStep(4)">See Memories 📸</button>
  </div>

  <!-- STEP 4 IMAGES -->
  <div id="step4" class="step">

    <img src="Gemini_Generated_Image_iqaszfiqaszfiqas.png">

    <img src="IMG_20260331_115548.jpg">

    <img src="IMG_20260331_115232.jpg">

    <img src="Snapchat-133094937.jpg">
    <p class="caption">wahh kya photo ayi h 🥲</p>

    <img src="Snapchat-436404627.jpg">
    <p class="caption">happy birthday heroine ✨🥳😘</p>

    <button onclick="nextStep(5)">Final Surprise 🎁</button>
  </div>

  <!-- FINAL -->
  <div id="step5" class="step">
    <h2>💖 Tu meri life ka best part hai 💖</h2>
    <h3>Stay happy always 🥳</h3>
  </div>

</div>

<!-- MUSIC -->
<audio id="music" src="https://www.bensound.com/bensound-music/bensound-happyrock.mp3"></audio>

<script>
function nextStep(step) {
  document.getElementById("step" + step).style.display = "block";

  // music start only first time
  if(step === 1){
    document.getElementById("music").play();
  }

  // smooth hearts
  let heart = document.createElement("div");
  heart.className = "heart";
  heart.innerHTML = "💖";
  heart.style.left = Math.random() * 100 + "vw";
  heart.style.fontSize = (Math.random() * 20 + 10) + "px";
  document.body.appendChild(heart);

  setTimeout(() => {
    heart.remove();
  }, 4000);
}
</script>

</body>
</html>
