<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Birthday Surprise 🎉</title>

<style>
body {
  margin: 0;
  font-family: 'Poppins', sans-serif;
  text-align: center;
  background: linear-gradient(135deg, #ff9a9e, #fad0c4);
  overflow-x: hidden;
}

h1 {
  margin-top: 50px;
  color: white;
  font-size: 2.5em;
}

button {
  padding: 12px 25px;
  border: none;
  border-radius: 25px;
  background: white;
  color: #ff4e50;
  font-size: 16px;
  cursor: pointer;
}

.hidden {
  display: none;
}

.message {
  font-size: 2em;
  color: yellow;
  animation: fadeIn 2s ease;
}

.gallery img {
  width: 80%;
  max-width: 300px;
  border-radius: 15px;
  margin-top: 20px;
}

.caption {
  color: white;
  font-size: 18px;
}

@keyframes fadeIn {
  from {opacity: 0;}
  to {opacity: 1;}
}

.heart {
  position: fixed;
  color: red;
  animation: float 5s linear infinite;
}

@keyframes float {
  0% {transform: translateY(100vh);}
  100% {transform: translateY(-10vh);}
}
</style>
</head>

<body>

<h1>🎉 Tap for Surprise 🎁</h1>

<button onclick="startSurprise()">Open 💖</button>

<div id="content" class="hidden">

  <p class="message">🎂 Happy Birthday My Bestie 🎂</p>
  <p class="message">Tu meri life ka best part hai 💕</p>

  <div class="gallery">

    <img src="Gemini_Generated_Image_iqaszfiqaszfiqas.png">
    
    <img src="IMG_20260331_115548.jpg">
    
    <img src="IMG_20260331_115232.jpg">

    <img src="Snapchat-133094937.jpg">
    <p class="caption">wahh kya photo ayi h 🥲</p>

    <img src="Snapchat-436404627.jpg">
    <p class="caption">happy birthday heroine ✨🥳😘</p>

  </div>

</div>

<!-- MUSIC -->
<audio id="music" src="https://www.bensound.com/bensound-music/bensound-happyrock.mp3"></audio>

<script>
function startSurprise() {
  document.getElementById("content").classList.remove("hidden");
  document.getElementById("music").play();

  // Hearts
  setInterval(() => {
    let heart = document.createElement("div");
    heart.className = "heart";
    heart.innerHTML = "💖";
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.fontSize = (Math.random() * 20 + 10) + "px";
    document.body.appendChild(heart);

    setTimeout(() => {
      heart.remove();
    }, 5000);
  }, 300);

  // Confetti
  for (let i = 0; i < 100; i++) {
    let conf = document.createElement("div");
    conf.innerHTML = "🎊";
    conf.style.position = "fixed";
    conf.style.left = Math.random() * 100 + "vw";
    conf.style.top = Math.random() * 100 + "vh";
    conf.style.fontSize = "20px";
    document.body.appendChild(conf);
  }
}
</script>

</body>
</html>
