<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Special Surprise 🎁</title>

<style>
body {
  margin: 0;
  font-family: 'Poppins', sans-serif;
  text-align: center;
  background: radial-gradient(circle, #ffdde1, #ee9ca7);
  overflow: hidden;
}

.container {
  margin-top: 80px;
}

h1 {
  font-size: 2.5em;
  color: white;
}

button {
  padding: 12px 25px;
  border: none;
  border-radius: 25px;
  background: white;
  color: #ff4e50;
  font-size: 16px;
  cursor: pointer;
  transition: 0.3s;
}

button:hover {
  background: #ff4e50;
  color: white;
}

.hidden {
  display: none;
}

.message {
  margin-top: 20px;
  font-size: 2em;
  color: yellow;
  animation: fadeIn 2s ease forwards;
}

@keyframes fadeIn {
  from {opacity: 0;}
  to {opacity: 1;}
}

.heart {
  position: absolute;
  color: red;
  animation: float 5s linear infinite;
}

@keyframes float {
  0% {transform: translateY(100vh);}
  100% {transform: translateY(-10vh);}
}
</style>
</head>

<body>

<div class="container">
  <h1>🎉 Hey Bestie 💖</h1>
  <p style="color:white;">Tap for your surprise 👇</p>

  <button onclick="showSurprise()">Open 🎁</button>

  <div id="surprise" class="hidden">
    <p class="message">🎂 Happy Birthday Mittu 🎂</p>
    <p class="message">Tu meri life ka best part hai 💕</p>
    <p class="message">Stay खुश हमेशा 🥳</p>
  </div>
</div>

<script>
function showSurprise() {
  document.getElementById("surprise").classList.remove("hidden");

  // hearts animation
  setInterval(() => {
    let heart = document.createElement("div");
    heart.className = "heart";
    heart.innerHTML = "💖";
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.fontSize = (Math.random() * 20 + 10) + "px";
    document.body.appendChild(heart);

    setTimeout(() => {
      heart.remove();
    }, 5000);
  }, 300);
}
</script>

</body>
</html>
