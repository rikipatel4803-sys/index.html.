<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Birthday Surprise 🎉</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Comic Sans MS', cursive;
      text-align: center;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      overflow: hidden;
    }

    h1 {
      margin-top: 50px;
      font-size: 3em;
      color: #fff;
      animation: pop 1s ease-in-out infinite alternate;
    }

    p {
      font-size: 1.5em;
      color: #fff;
    }

    @keyframes pop {
      from { transform: scale(1); }
      to { transform: scale(1.1); }
    }

    .btn {
      margin-top: 30px;
      padding: 15px 30px;
      font-size: 18px;
      border: none;
      border-radius: 30px;
      background: #fff;
      color: #ff4e50;
      cursor: pointer;
      transition: 0.3s;
    }

    .btn:hover {
      background: #ff4e50;
      color: white;
    }

    .hidden {
      display: none;
    }

    .message {
      font-size: 2em;
      margin-top: 20px;
      color: yellow;
    }
  </style>
</head>

<body>

  <h1>🎉 Happy Birthday 🎂</h1>
  <p>Click below for your surprise 😍</p>

  <button class="btn" onclick="showSurprise()">Open Surprise 🎁</button>

  <div id="surprise" class="hidden">
    <p class="message">💖 You are the best friend ever! 💖</p>
    <p class="message">May your day be full of happiness 🥳</p>
  </div>

  <script>
    function showSurprise() {
      document.getElementById("surprise").classList.remove("hidden");
    }
  </script>

</body>
</html>
