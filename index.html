<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Birthday Surprise 🎉</title>

<style>
body {
  margin: 0;
  font-family: 'Poppins', sans-serif;
  background: linear-gradient(135deg, #ff9a9e, #fad0c4);
  text-align: center;
  color: white;
  overflow: hidden;
}

h1 { margin-top: 50px; }

button {
  padding: 12px 25px;
  border-radius: 25px;
  border: none;
  background: white;
  color: #ff4e50;
  font-size: 16px;
  cursor: pointer;
  margin-top: 15px;
}

/* Slide animation */
.slide {
  position: absolute;
  width: 100%;
  top: 0;
  left: 100%;
  animation: slideIn 0.6s forwards;
}

@keyframes slideIn {
  from { left: 100%; }
  to { left: 0; }
}

/* Image */
img {
  width: 80%;
  max-width: 300px;
  border-radius: 15px;
  margin-top: 20px;
}

/* Hearts */
.heart {
  position: fixed;
  bottom: -10px;
  animation: rise 3s linear forwards;
}

@keyframes rise {
  0% {transform: translateY(0); opacity: 1;}
  100% {transform: translateY(-100vh); opacity: 0;}
}

/* Spark */
.spark {
  position: fixed;
  font-size: 18px;
  animation: pop 1s ease forwards;
}

@keyframes pop {
  0% {transform: scale(0); opacity: 1;}
  100% {transform: scale(1.5); opacity: 0;}
}
</style>
</head>

<body>

<h1>🎁 Tap for Surprise</h1>
<button onclick="start()">Open 💖</button>

<div id="content"></div>

<audio id="music" src="Screenrecording_20260419_185803.mp3" loop></audio>

<script>
let step = 0;

function start(){
  document.getElementById("music").play();
  next();
}

function next(){
  step++;

  let c = document.getElementById("content");

  let div = document.createElement("div");
  div.className = "slide";

  if(step === 1){
    div.innerHTML = "<h2>👀 Ready?</h2><button onclick='next()'>Next 👉</button>";
  }

  else if(step === 2){
    div.innerHTML = "<h2>🎂 Happy Birthday My Bestie 🎂</h2><p>Tu meri life ka best part hai 💕</p><button onclick='next()'>Memories 📸</button>";
  }

  else if(step === 3){
    div.innerHTML = "<img src='Gemini_Generated_Image_iqaszfiqaszfiqas.png'><br><button onclick='next()'>Next 📸</button>";
  }

  else if(step === 4){
    div.innerHTML = "<img src='IMG_20260331_115548.jpg'><br><button onclick='next()'>Next 📸</button>";
  }

  else if(step === 5){
    div.innerHTML = "<img src='IMG_20260331_115232.jpg'><br><button onclick='next()'>Next 📸</button>";
  }

  else if(step === 6){
    div.innerHTML = "<img src='Snapchat-133094937.jpg'><p>wahh kya photo ayi h 🥲</p><button onclick='next()'>Next 📸</button>";
  }

  else if(step === 7){
    div.innerHTML = "<img src='Snapchat-436404627.jpg'><p>happy birthday heroine ✨🥳😘</p><button onclick='next()'>Final 💖</button>";
  }

  else if(step === 8){
    div.innerHTML = "<h2>💖 Stay happy always 🥳</h2>";
  }

  // 👉 IMPORTANT FIX (no line stacking)
  c.innerHTML = "";
  c.appendChild(div);

  // 💖 Hearts
  for(let i=0;i<3;i++){
    let h = document.createElement("div");
    h.className = "heart";
    h.innerHTML = "💖";
    h.style.left = Math.random()*100+"vw";
    h.style.fontSize = (Math.random()*10+15)+"px";
    document.body.appendChild(h);
    setTimeout(()=>h.remove(),3000);
  }

  // ✨ Spark
  for(let i=0;i<5;i++){
    let s = document.createElement("div");
    s.className = "spark";
    s.innerHTML = "✨";
    s.style.left = Math.random()*100+"vw";
    s.style.top = Math.random()*100+"vh";
    document.body.appendChild(s);
    setTimeout(()=>s.remove(),1000);
  }
}
</script>

</body>
</html>
